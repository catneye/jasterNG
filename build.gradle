plugins {
    id 'java-library'
}

group = 'com.catnyey'
version = '0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.apache.commons', name:'commons-lang3', version: '3.20.0'
    implementation group: 'commons-net', name: 'commons-net', version: '3.13.0'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.15.0'
}